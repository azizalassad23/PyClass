name: Bangun APK Android

# APK dibangun di sini, bukan di komputer guru: runner GitHub sudah punya
# Android SDK, jadi tidak perlu memasang Android Studio di mana pun.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bangun APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Beri nama berkas
        run: |
          mkdir -p keluaran
          cp android/app/build/outputs/apk/release/app-release.apk "keluaran/PyClass-Ujian.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PyClass-Ujian-apk
          path: keluaran/PyClass-Ujian.apk

      # Rilis dengan tag tetap: tautan unduhannya tidak pernah berubah, jadi
      # QR yang sudah dicetak tetap berlaku setelah aplikasi diperbarui.
      - name: Perbarui rilis apk-terbaru
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-terbaru --yes --cleanup-tag || true
          gh release create apk-terbaru "keluaran/PyClass-Ujian.apk" \
            --title "PyClass Ujian — APK terbaru" \
            --notes "Dibangun otomatis dari commit ${GITHUB_SHA}. Pasang di HP murid lewat tautan ini."
